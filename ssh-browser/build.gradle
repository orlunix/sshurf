plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.sshbrowser'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.sshbrowser'
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName '0.0.15'
    }

    // Versioned artifact name: sshurf-0.0.x.apk (uploaded to netdisk per release, never overwritten)
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "sshurf-${defaultConfig.versionName}.apk"
        }
    }
}

dependencies {
    // SSH client (maintained fork of JSch).
    implementation 'com.github.mwiede:jsch:2.28.0'
    // ProxyController for pointing WebView at the local SOCKS5 proxy.
    implementation 'androidx.webkit:webkit:1.10.0'
    // Keystore-backed encrypted storage for credentials and the private key.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
