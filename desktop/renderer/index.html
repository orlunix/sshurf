<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>sshurf</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  #toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #fff; border-bottom: 1px solid #e0e0e0; }
  #dot { font-size: 14px; color: #9e9e9e; }
  #dot.on { color: #4caf50; } #dot.ing { color: #ffc107; }
  #state { font-size: 12px; color: #666; white-space: nowrap; }
  #url { flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  button { padding: 6px 12px; border: 1px solid #ccc; background: #f5f5f5; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:hover { background: #e8e8e8; }
  #wv { flex: 1; width: 100%; }
  #settings { position: fixed; top: 44px; right: 10px; width: 340px; background: #fff; border: 1px solid #ddd;
              border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 16px; display: none; z-index: 10; }
  #settings.open { display: block; }
  #settings h2 { font-size: 14px; margin-bottom: 10px; }
  #settings input { width: 100%; padding: 6px 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
  #settings .row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 13px; align-items: center; }
  #keypath { font-size: 12px; color: #666; word-break: break-all; }
  #log { height: 120px; overflow-y: auto; background: #111; color: #9e9e9e; font: 11px monospace;
         padding: 6px; border-radius: 4px; margin-top: 10px; white-space: pre-wrap; }
  #log .ok { color: #66bb6a; } #log .fail { color: #ef5350; }
</style>
</head>
<body>
  <div id="toolbar">
    <span id="dot">●</span><span id="state">未连接</span>
    <input id="url" placeholder="输入网址，回车打开" autofocus>
    <button id="go">访问</button>
    <button id="toggle">连接</button>
    <button id="gear">⚙</button>
  </div>
  <webview id="wv" partition="persist:browser" src="about:blank"></webview>

  <div id="settings">
    <h2>SSH 服务器</h2>
    <input id="s-host" placeholder="主机">
    <input id="s-port" placeholder="端口（默认 22）" type="number">
    <input id="s-user" placeholder="用户名">
    <div class="row">
      <label><input type="radio" name="auth" id="s-auth-key" value="key" checked style="width:auto"> 私钥</label>
      <label><input type="radio" name="auth" id="s-auth-pass" value="password" style="width:auto"> 密码</label>
    </div>
    <div class="row">
      <button id="s-pickkey">选择私钥文件</button>
    </div>
    <div id="keypath">（未选择）</div>
    <input id="s-passphrase" placeholder="私钥口令（可选）" type="password">
    <input id="s-password" placeholder="密码（选密码认证时填）" type="password">
    <div class="row">
      <button id="s-save">保存并连接</button>
    </div>
    <div id="log"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
