<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>sshurf</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  #toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #fff; border-bottom: 1px solid #e0e0e0; }
  #dot { font-size: 14px; color: #9e9e9e; }
  #dot.on { color: #4caf50; } #dot.ing { color: #ffc107; }
  #state { font-size: 12px; color: #666; white-space: nowrap; }
  #url { flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  button { padding: 6px 12px; border: 1px solid #ccc; background: #f5f5f5; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:hover { background: #e8e8e8; }
  #bmbar { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: #fafafa; border-bottom: 1px solid #eee; overflow-x: auto; }
  .chip { padding: 3px 10px; background: #fff; border: 1px solid #ddd; border-radius: 12px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .chip:hover { background: #f0f0f0; }
  #wv { flex: 1; width: 100%; }
  .panel { position: fixed; top: 76px; right: 10px; width: 380px; max-height: 70vh; overflow-y: auto; background: #fff;
           border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 14px; display: none; z-index: 10; }
  .panel.open { display: block; }
  .panel h2 { font-size: 14px; margin-bottom: 10px; }
  .panel input[type=text], .panel input[type=password], .panel input[type=number] { width: 100%; padding: 6px 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #e5e5e5; border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  .prow.enabled { border-color: #4caf50; background: #f6fbf6; }
  .prow .meta { flex: 1; min-width: 0; }
  .prow .name { font-weight: bold; font-size: 13px; }
  .prow .sum { font-size: 11px; color: #777; }
  .prow button { padding: 3px 8px; font-size: 12px; }
  .pform { border: 1px dashed #bbb; border-radius: 6px; padding: 10px; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 13px; align-items: center; }
  .small { font-size: 12px; color: #666; word-break: break-all; }
  .hrow { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
  .hrow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .hrow .t:hover { color: #1976d2; }
  .hrow button { padding: 2px 8px; font-size: 12px; }
  #log { height: 110px; overflow-y: auto; background: #111; color: #9e9e9e; font: 11px monospace;
         padding: 6px; border-radius: 4px; margin-top: 10px; white-space: pre-wrap; }
  #log .ok { color: #66bb6a; } #log .fail { color: #ef5350; }
</style>
</head>
<body>
  <div id="toolbar">
    <span id="dot">●</span><span id="state">未连接</span>
    <input id="url" placeholder="输入网址，回车打开" autofocus>
    <button id="go">访问</button>
    <button id="star" title="收藏当前页">☆</button>
    <button id="histbtn" title="最近访问">🕘</button>
    <button id="gear" title="SSH 设置">⚙</button>
  </div>
  <div id="bmbar"></div>
  <webview id="wv" partition="persist:browser" src="about:blank"></webview>

  <div id="histpanel" class="panel">
    <h2>最近访问</h2>
    <div id="histlist"></div>
  </div>

  <div id="settings" class="panel">
    <h2>SSH 服务器</h2>
    <div id="proflist"></div>
    <button id="addprof">＋ 添加服务器</button>
    <div class="row" style="margin-top:10px">
      <button id="connbtn">连接</button>
    </div>
    <div id="log"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
